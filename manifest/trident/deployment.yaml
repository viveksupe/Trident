# trident Deployment + Services (in-cluster variant).
# Rendered by scripts/deploy.sh (values substituted). The shim needs the RBAC
# in sa-rbac.yaml.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trident
  namespace: ${TRI_NAMESPACE}
  labels:
    app: trident
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trident
  strategy:
    type: Recreate # the sqlite state is a local State at /var/lib/trident
  template:
    metadata:
      labels:
        app: trident
    spec:
      serviceAccountName: trident
      containers:
      - name: trident
        image: ${TRI_IMAGE}
        args: ["serve"]
        env:
        - name: TRI_LISTEN_ADDR
          value: "0.0.0.0:8080"
        - name: TRI_TLS_LISTEN_ADDR
          value: ":8443"
        # Front key: what Open WebUI presents.
        - name: TRI_API_KEY
          valueFrom:
            secretKeyRef:
              name: trident-api-key
              key: api-key
        # Actor key MUST be distinct: agents hold the front key (baked into
        # the actor as OPEN_TERMINAL_API_KEY) and reach the callback listener,
        # so a shared key would let an agent proxy to any user's actor.
        - name: TRI_ACTOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: trident-api-key
              key: actor-api-key
        - name: TRI_BACKEND
          value: "substrate"
        - name: TRI_STATE_DB
          value: "/var/lib/trident/sessionmap.db"
        - name: TRI_ATESPACE
          value: "${ATESPACE}"
        - name: TRI_TEMPLATE_REF
          value: "${ATESPACE}/${TEMPLATE_NAME}"
        - name: TRI_ACTOR_PREFIX
          value: "tri-"
        - name: TRI_ACTOR_PORT
          value: "${ACTOR_PORT}"
        - name: TRI_IDLE_TTL
          value: "${IDLE_TTL}"
        - name: TRI_DELETE_IDLE_TTL
          value: "${DELETE_IDLE_TTL}"
        - name: TRI_MAX_AGE
          value: "${MAX_AGE}"
        - name: TRI_FEATURES_JSON
          value: "${FEATURES_JSON}"
        - name: TRI_EGRESS_HOSTS
          value: "${EGRESS_HOSTS}"
        # The egress approval flow: console token is human-only (≠ API key).
        - name: TRI_EGRESS_CALLBACK
          value: "trident-callback.${TRI_NAMESPACE}.svc:8443"
        - name: TRI_CONSOLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: trident-api-key
              key: console-token
        - name: TRI_EGRESS_OBSERVER_POD_SELECTOR
          value: "app=atenet-egress"
        - name: ATE_NAMESPACE
          value: "${ATE_SYSTEM_NAMESPACE}"
        ports:
        - name: http
          containerPort: 8080
        - name: callback
          containerPort: 8443
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        volumeMounts:
        - name: state
          mountPath: /var/lib/trident
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: trident-state

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trident-state
  namespace: ${TRI_NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: trident
  namespace: ${TRI_NAMESPACE}
spec:
  selector:
    app: trident
  ports:
  - name: http
    port: 80
    targetPort: http

---

# The egress callback entrypoint: actors resolve trident-callback over the
# pre-approved tls-passthrough rule and the shim terminates TLS on 8443.
apiVersion: v1
kind: Service
metadata:
  name: trident-callback
  namespace: ${TRI_NAMESPACE}
spec:
  selector:
    app: trident
  ports:
  - name: callback
    port: 8443
    targetPort: callback
